# Implementation of an android application

include:
  # Template
  - local: "/gitlab-ci/pipelines/templates/.app-pipeline.yml"

####################
# Job to implement #
####################

# Build #

build:
  extends: .build:app
  variables:
    APP: AXA # Since apps are ISO, it is possible to choose anyone to build
  rules:
    - when: never

# Appaloosa #

publish:appaloosa:all:
  extends: .publish:appaloosa:app
  variables:
    APP: "ALL"
  parallel:
    matrix:
      - ENV: ["FTR", "REC", "NRG", "HML", "PROD"]

publish:appaloosa:axa:
  extends: .publish:appaloosa:app
  variables:
    APP: "AXA"
  parallel:
    matrix:
      - ENV: ["FTR", "REC", "HML", "PROD"]

