# Template of an application

include:
  # Components
  - local: "/gitlab-ci/components/technical/.docker.yml"
  - local: "/gitlab-ci/components/ci/.publish.yml"
  - local: "/gitlab-ci/components/ci/.build.yml"
  - local: "/gitlab-ci/components/ci/.workflow.yml"
  - local: "/gitlab-ci/components/ci/.pre-process.yml"

stages:
  - build 🛠️
  - publish 🚀

variables:
  APP: ""

  ####################
  # Job to implement #
  ####################

.build:app:
  extends:
    - .gitrise
    - .build
  variables:
    BITRISE_VARS: "ENV:REC,APP:$APP"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: manual
      allow_failure: true

  ##################
  # Job to extends #
  ##################

.publish:appaloosa:app:
  extends:
    - .gitrise
    - .publish:appaloosa
  variables:
    DELIVERY_TYPE: "INTERNAL"
    BITRISE_VARS: "ENV:$ENV,APP:$APP,DELIVERY_TYPE:$DELIVERY_TYPE"

.publish:play-store:app:
  extends:
    - .gitrise
    - .publish:play-store
  variables:
    BITRISE_VARS: "ENV:$ENV,APP:$APP"

.publish:app-store:app:
  extends:
    - .gitrise
    - .publish:app-store
  variables:
    DELIVERY_TYPE: "EXTERNAL"
    BITRISE_VARS: "ENV:$ENV,APP:$APP,DELIVERY_TYPE:$DELIVERY_TYPE"
