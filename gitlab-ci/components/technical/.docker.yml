# Docker component

default:
  tags:
    - bitrise

#################
# Job to extend #
#################

# Load the Gitrise docker image
.gitrise:
  image: docker-registry.s.arkea.com/ccwm/gitrise:latest
  script:
    - gitrise --stream -a "$BITRISE_USER_TOKEN" -s "$BITRISE_APP_SLUG" -b "$CI_COMMIT_REF_NAME" -w "$BITRISE_WORKFLOW" -e "$BITRISE_VARS"

# Load the Gitrise docker image with the artifacts download option
.gitrise:download-artifacts:
  image: docker-registry.s.arkea.com/ccwm/gitrise:latest
  script:
    - gitrise --stream -a "$BITRISE_USER_TOKEN" -s "$BITRISE_APP_SLUG" -b "$CI_COMMIT_REF_NAME" -w "$BITRISE_WORKFLOW" -e "$BITRISE_VARS" -o "$BITRISE_ARTIFACTS_OUTPUT_DIR"
  artifacts:
    paths:
      - $BITRISE_ARTIFACTS_OUTPUT_DIR/

# Load the Sonar docker image
.sonar:cli:
  image: docker-registry.s.arkea.com/sonarsource/sonar-scanner-cli
  script:
    - sonar-scanner

# Load the Grandroid docker image
.grandroid:
  image: docker-registry.s.arkea.com/domi/grandroid:master
  tags:
    - android
    - sonar
  before_script:
    - bundle install
